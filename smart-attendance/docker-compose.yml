version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smartattend-db
    restart: always
    environment:
      MYSQL_DATABASE: smart_attendance
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartattend-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/smart_attendance?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      JWT_SECRET: 407f3f2d3e1d6c8b9a0f4e3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a207f3f2d3e1d6c8b9a0f4e3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a
      JWT_ACCESS_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
      FRONTEND_URL: http://localhost:5173
      APP_TIMEZONE: Asia/Kolkata
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
